# Serves the built frontend and forwards /api to the backend container - the same single origin as the Vite
# dev-server proxy, so the backend needs no CORS configuration.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Longer than the backend's total timeout for NBP calls (30 s), so the backend's own 504 reaches the user.
        proxy_read_timeout 60s;
    }

    # File names in /assets contain a content hash, so they never change and can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html is never cached, so a new build is picked up straight away.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
