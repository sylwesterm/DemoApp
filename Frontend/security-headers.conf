# Security headers, included in every location of nginx.conf: nginx drops inherited add_header directives in any
# location that sets its own (e.g. Cache-Control), so a server-level declaration would not reach every response.

# Only our own scripts; no inline scripts or eval (the Vite build has none). Styles allow 'unsafe-inline', because
# MUI (Emotion) inserts <style> tags at runtime. The API is called on the same origin (connect-src 'self').
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Browsers must not guess content types (e.g. run a JSON response as a script).
add_header X-Content-Type-Options "nosniff" always;
# The page cannot be embedded in a frame (clickjacking); frame-ancestors above does the same for modern browsers.
add_header X-Frame-Options "DENY" always;
# Other sites only see our origin, never full URLs with query parameters.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browser features the application does not use are switched off.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
